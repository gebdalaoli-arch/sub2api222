[package]
name = "sub2api-desktop"
version = "0.1.0"
edition = "2021"
authors = ["Sub2API"]
description = "Bright Windows desktop client for Sub2API users."
license-file = "../LICENSE"
repository = "https://github.com/Wei-Shaw/sub2api"

[dependencies]
anyhow = "1"
directories = "6"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = "1.16"
tokio = { version = "1", features = ["time"] }

[build-dependencies]
slint-build = "1.16"
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
